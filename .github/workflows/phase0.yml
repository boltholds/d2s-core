name: Phase 0 Rust/Fast DDS
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OS-level compiler/build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git \
            libasio-dev libtinyxml2-dev libssl-dev openjdk-17-jdk

      - name: Cache Fast DDS local dependencies
        uses: actions/cache@v4
        with:
          path: target/d2s-deps
          key: d2s-${{ runner.os }}-${{ runner.arch }}-fastdds-3.6.2-fastcdr-2.3.0-foonathan-1.3.1-gen-4.3.0-v1

      - name: Build and test automatic Fast DDS bootstrap
        run: |
          cargo test --workspace
          bash scripts/smoke.sh

  windows-native-smoke:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure JDK 17
        shell: pwsh
        run: |
          if ($env:JAVA_HOME_17_X64) {
            "JAVA_HOME=$env:JAVA_HOME_17_X64" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "$env:JAVA_HOME_17_X64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          }

      - name: Build and smoke test Windows automatic bootstrap
        shell: pwsh
        run: |
          cargo test --workspace
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1
